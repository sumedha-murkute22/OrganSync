version: '3.8'

services:
  organsync-db:
    image: postgres:16-alpine
    container_name: organsync_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: organsync_user
      POSTGRES_PASSWORD: organsync_secure_password
      POSTGRES_DB: organsync_db
    ports:
      - "5432:5432"
    volumes:
      - organsync_pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U organsync_user -d organsync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  organsync_pgdata:
